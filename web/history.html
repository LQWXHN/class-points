<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>历史记录</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preload" href="/assets/vendor/fontawesome/webfonts/fa-solid-900.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/vendor/fontawesome/css/all.min.css?v=56">
<link rel="stylesheet" href="/assets/apple.css?v=56">
<link rel="stylesheet" href="/assets/page-history.css?v=56">
</head>
<body>
<div class="history-wrap">
  <div class="page-header">
    <button id="btn-back" class="icon-btn" title="返回"><i class="fas fa-arrow-left"></i></button>
    <h1 class="page-title" style="margin:0">历史记录</h1>
    <span class="badge">共 <b id="total-count" style="margin:0 3px">0</b> 条</span>
    <div class="spacer flex1"></div>
    <button id="btn-export" class="btn btn-primary"><i class="fas fa-file-export"></i> 导出记录</button>
  </div>

  <div class="card filter-card">
    <div class="filter-row">
      <div class="segmented" id="type-seg">
        <button data-t="all" class="active">全部</button>
        <button data-t="add">加分</button>
        <button data-t="sub">扣分</button>
        <button data-t="system">系统</button>
      </div>
      <div class="search kw-input">
        <i class="fas fa-search"></i>
        <input type="text" id="f-kw" class="form-input" placeholder="搜索学生 / 原因…" autocomplete="off">
      </div>
    </div>
    <div class="filter-row">
      <input type="date" id="f-start" class="form-input date-input">
      <span class="text-3">至</span>
      <input type="date" id="f-end" class="form-input date-input">
      <div style="display:flex;gap:7px;flex-wrap:wrap">
        <button class="chip quick-chip" data-q="today">今天</button>
        <button class="chip quick-chip" data-q="week">本周</button>
        <button class="chip quick-chip" data-q="month">本月</button>
        <button class="chip quick-chip" data-q="all">全部</button>
      </div>
    </div>
  </div>

  <div class="card desktop-table">
    <div class="table-wrap">
      <table class="cp-table">
        <thead><tr>
          <th>学生</th><th>小组</th><th>类型</th><th>原因</th>
          <th style="text-align:right">积分</th><th>操作者</th><th>时间</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <div id="mobile-cards" class="mobile-cards"></div>

  <button id="load-more" class="btn btn-block load-more"><i class="fas fa-chevron-down"></i> 加载更多</button>
  <div id="load-state" class="load-state"></div>
</div>

<script src="/assets/common.js?v=56"></script>
<script src="/assets/page-history.js?v=56"></script>
</body>
</html>
