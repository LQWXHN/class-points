<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>加载中</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #f5f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
      "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    color: #1d1d1f;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  .stage { position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px;
    opacity: 0; transition: opacity .45s ease; cursor: pointer; }
  .stage.on { opacity: 1; }
  .stage.out { opacity: 0; }

  .logo { width: 108px; height: 108px; border-radius: 26px;
    box-shadow: 0 18px 44px rgba(124,58,237,.28);
    animation: logoIn .9s cubic-bezier(.22,1,.36,1) both; }
  .logo img { width: 100%; height: 100%; display: block; border-radius: 26px; }
  @keyframes logoIn {
    from { opacity: 0; transform: translateY(16px) scale(.82); }
    to   { opacity: 1; transform: none; }
  }

  .title-block { text-align: center; margin-top: 6px;
    animation: textIn .8s cubic-bezier(.22,1,.36,1) .25s both; }
  .title { font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
  .subtitle { margin-top: 7px; font-size: 12px; font-weight: 600;
    letter-spacing: .34em; color: #8e8e93; text-transform: uppercase; }
  @keyframes textIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }

  .progress { width: 168px; height: 4px; border-radius: 4px; background: #e5e5ea;
    overflow: hidden; margin-top: 14px;
    animation: textIn .8s cubic-bezier(.22,1,.36,1) .4s both; }
  .progress > i { display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, #7c3aed, #a855f7); border-radius: 4px;
    transition: width .2s linear; }

  .skip { position: absolute; top: calc(16px + env(safe-area-inset-top));
    right: calc(16px + env(safe-area-inset-right)); font-size: 14px; color: #8e8e93;
    background: rgba(255,255,255,.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(0,0,0,.06); padding: 7px 15px; border-radius: 980px;
    cursor: pointer; animation: textIn .6s ease .3s both; }
  .skip:active { opacity: .6; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <button class="skip" id="skip" type="button">跳过</button>
  <div class="logo"><img src="/assets/logo.svg" alt="logo" draggable="false"></div>
  <div class="title-block">
    <div class="title" id="title">班级积分系统</div>
    <div class="subtitle">Class&nbsp;Points</div>
  </div>
  <div class="progress"><i id="bar"></i></div>
</div>

<script>
(function () {
  'use strict';
  const PLAYED_KEY = 'cp_ae_played';
  const next = new URLSearchParams(location.search).get('next');
  const goNext = () => location.replace(next || '/index.html');

  if (sessionStorage.getItem(PLAYED_KEY) === '1') { goNext(); return; }
  sessionStorage.setItem(PLAYED_KEY, '1');

  const stage = document.getElementById('stage');
  const bar = document.getElementById('bar');
  const titleEl = document.getElementById('title');
  requestAnimationFrame(() => stage.classList.add('on'));

  // 网站标题（后台可配）
  let siteTitle = '班级积分系统';
  try { const c = localStorage.getItem('cp_site_title'); if (c) siteTitle = c; } catch (e) {}
  fetch('/api/snapshot').then(r => r.json()).then(d => {
    const t = d && d.data && d.data.config && d.data.config.site_title;
    if (t) {
      siteTitle = t;
      try { localStorage.setItem('cp_site_title', t); } catch (e) {}
      titleEl.textContent = t;
      document.title = t;
    }
  }).catch(() => {});

  const DURATION = 2600;
  const start = performance.now();
  let done = false;
  function frame(now) {
    const p = Math.min(1, (now - start) / DURATION);
    bar.style.width = (p * 100).toFixed(1) + '%';
    if (p < 1 && !done) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function finish() {
    if (done) return;
    done = true;
    bar.style.width = '100%';
    stage.classList.add('out');
    setTimeout(goNext, 430);
  }
  setTimeout(finish, DURATION);
  document.getElementById('skip').addEventListener('click', e => { e.stopPropagation(); finish(); });
  stage.addEventListener('click', finish);
})();
</script>
</body>
</html>
